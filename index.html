<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201b"><link rel="manifest" href="manifest.json">
<title>ScanGate</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--paper:#f4f5f2;--ink:#14201b;--mute:#6a756f;--line:#d9ddd8;--ok:#1b7f4b;--okbg:#e2f2e8;--extra:#b86a00;--extrabg:#fdf0d9;--bad:#b3261e;--badbg:#fbe4e2;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:650;flex:1}
header button{background:none;border:0;color:#cfe3d8;font-size:14px;padding:6px}
main{padding:16px;max-width:560px;margin:0 auto;padding-bottom:110px}
h2{font-size:15px;margin:0 0 10px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid #7bbf9b;outline-offset:1px}
.btn{width:100%;font-size:17px;font-weight:650;padding:14px;border-radius:10px;border:0;background:var(--ink);color:#fff;margin-top:12px}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45}
.store{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;font-size:16px}
.store small{color:var(--mute);display:block;margin-top:2px}
.store b{font-size:20px}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.counts div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 2px;text-align:center}
.counts b{display:block;font-size:20px}
.counts span{font-size:11px;color:var(--mute)}
.counts .m b{color:var(--bad)}.counts .e b{color:var(--extra)}.counts .r b{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;margin-bottom:6px;font-size:15px;font-variant-numeric:tabular-nums;border:1px solid transparent}
.row.pending{background:#eceee9;color:#8a948e}
.row.matched{background:var(--okbg);color:var(--ok);font-weight:600}
.row.extra{background:var(--extrabg);color:var(--extra);font-weight:600}
.row.missing{background:var(--badbg);color:var(--bad);font-weight:600}
.tag{font-size:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:none;z-index:6}
.bar .btn{margin:0}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000}
.modal{position:fixed;inset:0;background:rgba(20,32,27,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 6px;color:var(--mute)}
.msg{padding:10px 12px;border-radius:8px;font-size:14px;margin-top:10px}
.msg.err{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--okbg);color:var(--ok)}
.hidden{display:none}
.otp{letter-spacing:.5em;text-align:center;font-size:28px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(prefers-reduced-motion:no-preference){.row{transition:background .25s}}
</style>
</head>
<body>
<header><h1 id="title">ScanGate</h1><button id="back" class="hidden">Back</button><button id="logout" class="hidden">Log out</button></header>
<main id="app"></main>

<div class="modal" id="extraModal"><div class="sheet">
  <h3>Order not assigned to you</h3>
  <p id="extraId" style="font-weight:650;color:var(--ink);font-size:18px"></p>
  <p>This order is not on this store's list. Accept it to add it to Extra.</p>
  <button class="btn ok" id="acceptExtra">Accept order</button>
  <button class="btn alt" id="rejectExtra">Reject order</button>
</div></div>

<script>
/* ====== CONFIG ====== */
const API_URL = "";   // paste your Apps Script Web App URL here. Leave empty to run in demo mode.
/* ==================== */

const $ = s => document.querySelector(s);
const S = { runner:null, pin:null, store:null, orders:[], scanned:new Set(), extras:new Set(), batch:null, scanner:null, scanning:false, started:false, finished:false, busy:false, lastScan:"", lastAt:0 };

/* ---------- API (demo data when API_URL is empty) ---------- */
const DEMO = { stores:[{vendor:"V101",name:"Apollo Pharmacy, Andheri",count:6},{vendor:"V102",name:"MedPlus, Powai",count:4}],
  orders:{V101:["PO1001","PO1002","PO1003","PO1004","PO1005","PO1006"],V102:["PO2001","PO2002","PO2003","PO2004"]} };
let demoOtp=null, demoAt=0;
async function api(action, data={}){
  if(!API_URL){
    await new Promise(r=>setTimeout(r,300));
    if(action==="login") return {ok:true,name:data.runner_id};
    if(action==="locations") return {ok:true,locations:[{city:"Mumbai",location:"Andheri"},{city:"Mumbai",location:"Powai"},{city:"Pune",location:"Hinjewadi"}]};
    if(action==="register") return {ok:true};
    if(action==="stores") return {ok:true,stores:DEMO.stores};
    if(action==="orders") return {ok:true,orders:DEMO.orders[data.vendor]};
    if(action==="done"){ if(!demoOtp||Date.now()-demoAt>6e5){demoOtp=String(Math.floor(1000+Math.random()*9000));demoAt=Date.now();}
      console.log("DEMO OTP:",demoOtp); return {ok:true,batch_id:"DEMO-1",otp_sent:true}; }
    if(action==="verify"){ if(Date.now()-demoAt>6e5) return {ok:false,error:"OTP expired. Scan again to get a new OTP."};
      return data.otp===demoOtp?{ok:true}:{ok:false,error:"Wrong OTP. Check with the store and try again."}; }
  }
  const body = JSON.stringify({action, runner_id:S.runner, pin:S.pin, ...data});
  const res = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
  return res.json();
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nav(title, back){ $("#title").textContent=title; $("#back").classList.toggle("hidden",!back); $("#logout").classList.toggle("hidden",!S.runner); $("#back").onclick=back||null; }
function stats(){
  const matched=S.orders.filter(o=>S.scanned.has(o)), missing=S.orders.filter(o=>!S.scanned.has(o));
  return {expected:S.orders.length, scanned:matched.length+S.extras.size, received:matched.length, missing, matched, extra:[...S.extras]};
}
function countsHtml(s){ return `<div class="counts">
  <div><b>${s.expected}</b><span>Expected</span></div><div><b>${s.scanned}</b><span>Scanned</span></div>
  <div class="r"><b>${s.received}</b><span>Received</span></div><div class="m"><b>${s.missing.length}</b><span>Missing</span></div>
  <div class="e"><b>${s.extra.length}</b><span>Extra</span></div></div>`; }
function beep(){ try{navigator.vibrate&&navigator.vibrate(60);}catch(e){} }

/* ---------- screens ---------- */
function login(){
  S.runner=null; nav("ScanGate");
  $("#app").innerHTML=`<div class="card"><h2>Runner login</h2>
    <label for="rid">Runner ID</label><input id="rid" autocomplete="username" inputmode="text">
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <div id="err"></div><button class="btn" id="go">Log in</button>
    <button class="btn alt" id="reg">New runner? Register</button></div>
    ${API_URL?"":'<div class="msg info">Demo mode: enter any ID and PIN. The OTP is printed in the browser console.</div>'}`;
  $("#reg").onclick=register;
  $("#go").onclick=async()=>{
    const id=$("#rid").value.trim(), pin=$("#pin").value.trim(); if(!id||!pin){$("#err").innerHTML='<div class="msg err">Enter your runner ID and PIN.</div>';return;}
    S.runner=id;S.pin=pin; $("#go").disabled=true;
    try{ const r=await api("login"); if(!r.ok) throw new Error(r.error||"Login failed");
      localStorage.setItem("rh_user",JSON.stringify({id,pin})); stores();
    }catch(e){ S.runner=null;S.pin=null; $("#go").disabled=false; $("#err").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  };
}
async function register(){
  nav("Register",login);
  $("#app").innerHTML=`<div class="card"><h2>New runner registration</h2>
    <label for="nid">Runner ID</label><input id="nid">
    <label for="nname">Full name</label><input id="nname" autocomplete="name">
    <label for="npin">Choose a PIN (4 to 6 digits)</label><input id="npin" type="password" inputmode="numeric" maxlength="6">
    <label for="ncity">City</label><select id="ncity"><option value="">Select city</option></select>
    <label for="nloc">Location</label><select id="nloc" disabled><option value="">Select city first</option></select>
    <div id="err"></div><button class="btn" id="sub">Register</button></div>`;
  let locs=[];
  try{ const r=await api("locations"); locs=r.locations||[]; }catch(e){}
  if(!locs.length){ $("#err").innerHTML='<div class="msg err">No locations set up yet. Ask your admin to fill the Locations tab.</div>'; }
  [...new Set(locs.map(l=>l.city))].forEach(c=>$("#ncity").insertAdjacentHTML("beforeend",`<option>${esc(c)}</option>`));
  $("#ncity").onchange=()=>{ const c=$("#ncity").value; const l=locs.filter(x=>x.city===c);
    $("#nloc").innerHTML=`<option value="">Select location</option>`+l.map(x=>`<option>${esc(x.location)}</option>`).join(""); $("#nloc").disabled=!c; };
  $("#sub").onclick=async()=>{
    const d={new_id:$("#nid").value.trim(),name:$("#nname").value.trim(),new_pin:$("#npin").value.trim(),city:$("#ncity").value,location:$("#nloc").value};
    if(!d.new_id||!d.name||!d.new_pin||!d.city||!d.location){$("#err").innerHTML='<div class="msg err">Fill in all fields.</div>';return;}
    if(!/^\d{4,6}$/.test(d.new_pin)){$("#err").innerHTML='<div class="msg err">PIN must be 4 to 6 digits.</div>';return;}
    $("#sub").disabled=true;
    try{ S.runner=null; const r=await api("register",d); if(!r.ok) throw new Error(r.error||"Registration failed");
      S.runner=d.new_id;S.pin=d.new_pin; localStorage.setItem("rh_user",JSON.stringify({id:d.new_id,pin:d.new_pin})); stores();
    }catch(e){ $("#sub").disabled=false; $("#err").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  };
}
async function stores(){
  nav("Select store");
  $("#app").innerHTML=`<p style="color:var(--mute)">Loading stores…</p>`;
  try{ const r=await api("stores"); if(!r.ok) throw new Error(r.error);
    $("#app").innerHTML=(r.stores.length?"":`<div class="msg info">No pending stores right now.</div>`)+r.stores.map(s=>
      `<button class="store" data-v="${esc(s.vendor)}" data-n="${esc(s.name)}"><span>${esc(s.name)}<small>${esc(s.vendor)}</small></span><b>${s.count}</b></button>`).join("");
    document.querySelectorAll(".store").forEach(b=>b.onclick=()=>openStore(b.dataset.v,b.dataset.n));
  }catch(e){ $("#app").innerHTML=`<div class="msg err">${esc(e.message||"Could not load stores")}</div><button class="btn" onclick="stores()">Try again</button>`; }
}
async function openStore(vendor,name){
  S.store={vendor,name}; S.started=false; S.finished=false; S.scanned=new Set(); S.extras=new Set(); S.batch=null;
  nav(name,()=>{stopScan();stores();});
  $("#app").innerHTML=`<p style="color:var(--mute)">Loading orders…</p>`;
  try{ const r=await api("orders",{vendor}); if(!r.ok) throw new Error(r.error); S.orders=r.orders; scanScreen(); }
  catch(e){ $("#app").innerHTML=`<div class="msg err">${esc(e.message||"Could not load orders")}</div>`; }
}
function scanScreen(){
  nav(S.store.name,()=>{stopScan();stores();});
  $("#app").innerHTML=`<div id="counts"></div>
    <div id="readerWrap" class="hidden"><div id="reader"></div><button class="btn alt" id="stop">Pause scanning</button></div>
    <div class="card" id="manual"><label for="mid" style="margin-top:0">Camera not reading? Type the order ID</label>
      <div style="display:flex;gap:8px"><input id="mid" autocapitalize="characters"><button class="btn" style="width:90px;margin:0" id="madd">Add</button></div></div>
    <div id="list"></div>
    <div class="bar"><button class="btn alt" id="scanBtn">Scan orders</button><button class="btn" id="doneBtn" disabled>Done scanning</button></div>`;
  $("#scanBtn").onclick=startScan; $("#stop").onclick=stopScan;
  $("#madd").onclick=()=>{const v=$("#mid").value.trim(); if(v){onCode(v);$("#mid").value="";}};
  $("#doneBtn").onclick=doneScan; $("#doneBtn").disabled=!S.started; render();
}
function render(){
  const s=stats(); $("#counts").innerHTML=countsHtml(s);
  const rows=S.orders.map(o=>S.scanned.has(o)?`<div class="row matched"><span>${esc(o)}</span><span class="tag">Scanned</span></div>`:S.finished?`<div class="row missing"><span>${esc(o)}</span><span class="tag">Missing</span></div>`:`<div class="row pending"><span>${esc(o)}</span><span class="tag">Not scanned</span></div>`);
  const ex=[...S.extras].map(o=>`<div class="row extra"><span>${esc(o)}</span><span class="tag">Extra</span></div>`);
  $("#list").innerHTML=`<h2>Orders for this store</h2>${rows.join("")}${ex.length?`<h2 style="margin-top:14px">Extra orders</h2>${ex.join("")}`:""}`;
}

/* ---------- scanning ---------- */
async function startScan(){
  S.started=true; S.finished=false; $("#doneBtn").disabled=false; render();
  $("#readerWrap").classList.remove("hidden"); $("#manual").classList.add("hidden");
  if(S.scanner){ S.scanning=true; return; }
  S.scanner=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.QR_CODE],verbose:false});
  try{ await S.scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140}},txt=>onCode(txt),()=>{}); S.scanning=true; }
  catch(e){ S.scanner=null; $("#readerWrap").classList.add("hidden"); $("#manual").classList.remove("hidden");
    $("#list").insertAdjacentHTML("afterbegin",`<div class="msg err">Camera not available. Allow camera access or type the order ID.</div>`); }
}
async function stopScan(){
  S.scanning=false; if(S.scanner){ try{await S.scanner.stop();}catch(e){} try{S.scanner.clear();}catch(e){} S.scanner=null; }
  const w=$("#readerWrap"); if(w) w.classList.add("hidden"); const m=$("#manual"); if(m) m.classList.remove("hidden");
}
function onCode(raw){
  const code=String(raw).trim(); const now=Date.now();
  if(!code||S.busy||!S.scanning&&S.scanner) return;
  if(code===S.lastScan&&now-S.lastAt<2500) return; S.lastScan=code;S.lastAt=now;
  if(S.scanned.has(code)||S.extras.has(code)){ beep(); return; }
  if(S.orders.includes(code)){ S.scanned.add(code); beep(); render(); return; }
  S.busy=true; $("#extraId").textContent=code; $("#extraModal").classList.add("on");
}
$("#acceptExtra").onclick=()=>{ S.extras.add($("#extraId").textContent); closeModal(); render(); };
$("#rejectExtra").onclick=closeModal;
function closeModal(){ $("#extraModal").classList.remove("on"); S.busy=false; S.lastAt=Date.now(); }

/* ---------- done + OTP ---------- */
async function doneScan(){
  await stopScan(); const s=stats();
  if(!s.scanned){ alert("Scan at least one order first."); return; }
  S.finished=true; render(); $("#doneBtn").disabled=true; $("#doneBtn").textContent="Sending OTP…";
  try{ const r=await api("done",{vendor:S.store.vendor,store:S.store.name,expected:S.orders,matched:s.matched,extra:s.extra});
    if(!r.ok) throw new Error(r.error||"Could not create handover"); S.batch=r.batch_id; otpScreen();
  }catch(e){ alert(e.message); S.finished=false; render(); $("#doneBtn").disabled=false; $("#doneBtn").textContent="Done scanning"; }
}
function otpScreen(){
  const s=stats(); nav("Enter OTP",()=>{S.started=false;S.finished=false;scanScreen();});
  $("#app").innerHTML=`${countsHtml(s)}
    <div class="card"><h2>Ask the store for the OTP</h2><p style="margin:0 0 4px;color:var(--mute)">The OTP was emailed to the store. It is valid for 10 minutes.</p>
    <label for="otp">OTP</label><input id="otp" class="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <div id="err"></div><button class="btn ok" id="verify">Confirm handover</button>
    <button class="btn alt" id="more">Scan more orders</button></div>
    ${s.missing.length?`<h2>Missing (${s.missing.length})</h2>`+s.missing.map(o=>`<div class="row missing"><span>${esc(o)}</span><span class="tag">Not received</span></div>`).join(""):""}`;
  $("#more").onclick=()=>{S.started=false;S.finished=false;scanScreen();};
  $("#verify").onclick=async()=>{
    const otp=$("#otp").value.trim(); if(!otp){$("#err").innerHTML='<div class="msg err">Enter the OTP.</div>';return;}
    $("#verify").disabled=true;
    try{ const r=await api("verify",{batch_id:S.batch,otp}); if(!r.ok) throw new Error(r.error||"Wrong OTP"); success(); }
    catch(e){ $("#verify").disabled=false; $("#err").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  };
}
function success(){
  const s=stats(); nav("Handover complete");
  $("#app").innerHTML=`${countsHtml(s)}<div class="msg info">${s.received+s.extra.length} orders are now out for delivery.${s.missing.length?` ${s.missing.length} missing order(s) have been reported by email.`:""}</div>
    <button class="btn" onclick="stores()">Back to stores</button>`;
}

/* ---------- boot ---------- */
$("#logout").onclick=()=>{localStorage.removeItem("rh_user");stopScan();login();};
try{ const u=JSON.parse(localStorage.getItem("rh_user")||"null"); if(u){S.runner=u.id;S.pin=u.pin;stores();} else login(); }catch(e){ login(); }
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
